; llama-server router mode 模型预设
; 启动时不传 -m / --model，改用 --models-preset 指向本文件
; 请求时用 "model": "<alias>" 路由到对应模型
; 公共参数放 [default]，单个模型 section 可覆盖

; 所有模型的公共默认值
[*]
jinja = true
chat-template-file = /models/Qwen3-0.6B-llama-fix-chat-template.jinja
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
threads = 12
cont-batching = true
metrics = true
; verbose 在生产环境建议去掉，或者换成 --log-level info
log-verbose = true

[summary]
alias = Qwen3-0.6B
model = /models/Qwen3-0.6B-BF16.gguf
ctx-size = 4096
repeat-penalty = 1.05
min-p = 0.03
temperature = 0.1
reasoning = off
n-predict = 1024
cache-prompt = true
cache-ram = 768
cache-idle-slots = true
parallel = 1
load-on-startup = true
log-file = /logs/llama-summary.log

[embedding]
alias = Qwen3-Embedding-0.6B
model = /models/Qwen3-Embedding-0.6B-f16.gguf
embeddings = true
; pooling 参数需要区分模型 Qwen3使用 last，harrier使用 mean
pooling = last
no-cache-prompt = true
cache-ram = 768
no-cache-idle-slots = true
parallel = 1
load-on-startup = true
log-file = /logs/llama-embedding.log

[reranker]
alias = Qwen3-Reranker-0.6B
model = /models/Qwen3-Reranker-0.6B-fixed-f16.gguf
reranking = true
pooling = rank
no-cache-prompt = true
cache-ram = 768
no-cache-idle-slots = true
parallel = 1
load-on-startup = true
log-file = /logs/llama-reranker.log
